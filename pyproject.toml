[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')"
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["frontend", "backend/alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
